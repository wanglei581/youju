        findParentId: function () {
            var me = this;
            // 获取所有 id
            var idMap = {};
            $.each(me.ztreeData2, function(i, item) {
                idMap[item.id] = true;
            });

            // 过滤出一级节点（它们的 parentId 不在 idMap 中且不为 null）
            var topLevelParentIds = [];
            $.each(me.ztreeData2, function(i, item) {
                if (item.parentId != null && !idMap[item.parentId]) {
                    topLevelParentIds.push(item.parentId);
                }
            });

            me.topLevelParentId = topLevelParentIds[0];
        },
        // 递归查找父节点
        findTopLevelParentNode: function (nodeId, nodes) {
            var me = this;
            var currentNode = $.grep(nodes, function(node) {
                return node.id == nodeId;
            })[0];

            // 循环遍历，直到找到parentId
            while (currentNode.parentId !== me.topLevelParentId) {
                currentNode = $.grep(nodes, function(node) {
                    return node.id === currentNode.parentId;
                })[0];
            }

            return currentNode;
        },
        // 目录树定位
        setScroll: function (treeNode) {
            var treeNodeElement = $("#" + treeNode.tId);
            var treeContainer = $(".xxgktree");
            var containerScrollTop = treeContainer.scrollTop();
            var offsetTop = treeNodeElement.offset().top - treeContainer.offset().top;
            var scrollDistance = offsetTop + containerScrollTop - 100;
            treeContainer.animate({ scrollTop: scrollDistance }, 500);
        },
        // 目录树搜索
        fuzzySearch: function (zTreeObj) {
            var nameKey = zTreeObj.setting.data.key.name;
            var isHighLight = true;
            var isExpand = true;
            zTreeObj.setting.view.nameIsHTML = isHighLight;

            var metaChar = '[\\[\\]\\\\\^\\.\\|\\?\\*\\+\\(\\)]';
            var rexMeta = new RegExp(metaChar, 'gi');

            function ztreeFilter(zTreeObj, _keywords, callBackFunc) {
                if (!_keywords) {
                    _keywords = ''; //default blank for _keywords
                }

                // function to find the matching node
                function filterFunc(node) {
                    /*if (node.isHidden) {
                        return false;
                    }*/

                    if (node && node.oldname && node.oldname.length > 0) {
                        node[nameKey] = node.oldname; //recover oldname of the node if exist
                    }
                    zTreeObj.updateNode(node); //update node to for modifications take effect
                    if (!node.staticTreeHide && _keywords.length == 0) {
                        //return true to show all nodes if the keyword is blank
                        zTreeObj.showNode(node);
                        zTreeObj.expandNode(node, isExpand);
                        return true;
                    }
                    //transform node name and keywords to lowercase
                    if (!node.staticTreeHide && node[nameKey] && node[nameKey].toLowerCase().indexOf(_keywords.toLowerCase()) != -1) {
                        if (isHighLight) { //highlight process
                            var newKeywords = _keywords.replace(rexMeta, function (matchStr) {
                                //add escape character before meta characters
                                return '\\' + matchStr;
                            });
                            node.oldname = node[nameKey]; //store the old name
                            var rexGlobal = new RegExp(newKeywords, 'gi');//'g' for global,'i' for ignore case
                            //use replace(RegExp,replacement) since replace(/substr/g,replacement) cannot be used here
                            node[nameKey] = node.oldname.replace(rexGlobal, function (originalText) {
                                //highlight the matching words in node name
                                var highLightText =
                                        '<span style="color: whitesmoke;background-color: #cd2527;">'
                                        + originalText
                                        + '</span>';
                                return highLightText;
                            });
                            zTreeObj.updateNode(node); //update node for modifications take effect
                        }
                        zTreeObj.showNode(node);//show node with matching keywords
                        return true; //return true and show this node
                    }

                    zTreeObj.hideNode(node); // hide node that not matched
                    return false; //return false for node not matched
                }

                var nodesShow = zTreeObj.getNodesByFilter(filterFunc); //get all nodes that would be shown

                processShowNodes(nodesShow, _keywords);//nodes should be reprocessed to show correctly
            }


            function processShowNodes(nodesShow, _keywords) {
                var noData$ = $('#noData');
                noData$.addClass('dn');
                var nodes = [];

                if (nodesShow && nodesShow.length > 0) {
                    $.each(nodesShow, function (i, node) {
                        if (!node.getPath()[0].staticTreeHide) {
                            nodes.push(node);
                        }
                    })
                }

                if (nodes.length > 0) {
                    //process the ancient nodes if _keywords is not blank
                    if (_keywords.length > 0) {
                        $.each(nodes, function (n, obj) {
                            var pathOfOne = obj.getPath();//get all the ancient nodes including current node
                            if (pathOfOne && pathOfOne.length > 0) {
                                //i < pathOfOne.length-1 process every node in path except self
                                for (var i = 0; i < pathOfOne.length - 1; i++) {
                                    zTreeObj.showNode(pathOfOne[i]); //show node
                                    zTreeObj.expandNode(pathOfOne[i], true); //expand node
                                }
                            }
                        });

                        $('#organ_catalog_tree').addClass('hide');
                        $('#organ_catalog_tree2').removeClass('hide');
                    } else { //show all nodes when _keywords is blank and expand the root nodes
                        var rootNodes = zTreeObj.getNodesByParam('level', '0');//get all root nodes
                        $.each(rootNodes, function (n, obj) {
                            zTreeObj.expandNode(obj, true); //expand all root nodes
                        });
                        $('#organ_catalog_tree').removeClass('hide');
                        $('#organ_catalog_tree2').addClass('hide');
                    }
                    console.log('has data')
                    $('.wgk_xxknr').scrollTop(0);
                } else {
                    console.log('no data')
                    $('#organ_catalog_tree').addClass('hide');
                    $('#organ_catalog_tree2').addClass('hide');
                    noData$.removeClass('dn');
                }
            }

            var timeoutId = null;
            var lastKeyword = '';

            function searchNodeLazy(_keywords) {
                if (timeoutId) {
                    //clear pending task
                    clearTimeout(timeoutId);
                }
                timeoutId = setTimeout(function () {
                    if (lastKeyword === _keywords) {
                        return;
                    }
                    ztreeFilter(zTreeObj, _keywords); //lazy load ztreeFilter function
                    lastKeyword = _keywords;
                }, 500);
            }

            zTreeObj.searchNodeLazy = searchNodeLazy;
        },

        open: function (href) {
            var me = this;

        // 获取中文字符的拼音首字母（兼容IE）
        getFirstLetter: function(char) {
            // 非中文字符直接返回大写首字母
            if (/[^\u4e00-\u9fa5]/.test(char)) {
                return char.toUpperCase().charAt(0);
            }

            // 遍历拼音首字母映射表查找
            for (var letter in pinyinFirstLetters) {
                if (pinyinFirstLetters.hasOwnProperty(letter) &&
                        pinyinFirstLetters[letter].indexOf(char) !== -1) {
                    return letter.toUpperCase();
                }
            }

            return '#'; // 无法识别的字符归类到#
        },
        // jQuery插件：按拼音首字母分类排序中文字符串
        sortChineseByPinyin: function(stringsArray) {
            var me = this;
            var groups = {};
            // 1. 分组
            $.each(stringsArray, function(index, str) {
                if (str && str.name && str.name.length > 0) {
                    var firstChar = str.name.charAt(0);
                    var firstLetter = me.getFirstLetter(firstChar);

                    if (!groups[firstLetter]) {
                        groups[firstLetter] = [];
                    }
                    groups[firstLetter].push(str);
                }
            });

            // 2. 每组内部排序（使用jQuery的排序和自定义比较函数）
            $.each(groups, function(letter, group) {
                group.sort(function(a, b) {
                    // 兼容IE的中文排序
                    return a.localeCompare ?
                            a.localeCompare(b, 'zh-CN') :
                            $(a).text().localeCompare($(b).text());
                });
            });

            // 3. 按字母顺序排列分组
            var sortedLetters = Object.keys(groups).sort();

            // 4. 构建结果
            var result = {
                grouped: groups,
                sorted: sortedLetters
            };

            return result;
        },
