<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纠错与申请覆盖 · 有据</title>
<style>
  :root {
    --brand: #2A5CE0; --brand-tint: #EAF0FF; --bg: #F2F4F8; --card: #FFFFFF;
    --t1: #1D2129; --t2: #4E5969; --line: #EEF0F3; --line2: #E5E6EB;
    --green: #0E8A63; --g-tint: #E8F7F1; --red: #E5484D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1); font: 15px/1.6 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 880px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 18px; }
  a { color: var(--brand); }
  .count, .meta, .hint { color: var(--t2); font-size: 14px; }
  .auth { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; color: var(--t1); }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line2); background: #fff; color: var(--t1); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  main { max-width: 880px; margin: 0 auto; padding: 16px; }
  .hint { margin: 0 0 12px; }
  .row, .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .filters { margin-bottom: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .meta { font-size: 13px; }
  .tag { padding: 0 6px; border-radius: 4px; background: var(--brand-tint); color: var(--brand); font-size: 12px; font-weight: 500; }
  .handled { background: var(--g-tint); color: var(--green); }
  .triage { margin: 8px 0; padding: 8px 12px; background: var(--brand-tint, #EAF0FF); color: var(--t1); border-radius: 8px; font-size: 14px; }
  .content { margin: 12px 0; padding: 10px 12px; background: #F7F8FA; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .document { margin: 8px 0; }
  .document a { font-weight: 600; }
  .msg { font-size: 13px; color: var(--red); }
  .ok { color: var(--green); }
  .empty { text-align: center; color: var(--t2); padding: 48px 0; }
  .more { display: block; margin: 8px auto 32px; }
  [hidden] { display: none !important; } /* 带 display 的样式会盖过 hidden 属性 */
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>纠错与申请覆盖</h1>
    <span class="count" id="count"></span>
    <a href="/admin/review">截止日期核对台</a>
    <a href="/admin/kinds">类型待定</a>
    <a href="/admin/audit">质检存疑</a>
    <a href="/admin/sources">来源接入</a>
    <div class="auth">
      <input id="token" type="password" placeholder="管理口令" size="16" aria-label="管理口令">
      <button class="primary" id="load">载入</button>
    </div>
  </div>
</header>
<main>
  <p class="hint">核对内容和原文后，选处理结果、需要时写一句给用户的说明，再标记已处理：提交的人在小程序“我的 → 我的数据”里能看到结果和说明。管理口令只保存在当前页面，刷新后需重新输入。</p>
  <div class="row filters">
    <label for="status">显示</label>
    <select id="status"><option value="pending">待处理</option><option value="all">全部</option></select>
  </div>
  <div id="list"></div>
  <button class="more" id="more" hidden>再载入 20 条</button>
</main>
<script src="/admin/embed.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const shown = new Set();
  let cursor = null;
  // 正在提交的操作数：有操作没回来时不能重新载入、切换筛选、翻页，免得卡片被换掉后又能重复提交
  let pending = 0;
  function listBusy(delta) {
    pending += delta;
    for (const id of ['load', 'status', 'more']) $(id).disabled = pending > 0;
  }

  function headers() { return { 'X-Admin-Token': youjuAdminToken() }; }
  function el(tag, cls, value) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (value !== undefined) node.textContent = value;
    return node;
  }
  function errorFor(res) {
    if (res.status === 401 || res.status === 429) return '口令不对、未配置，或输错次数过多';
    return `请求失败（${res.status}）`;
  }
  async function refreshCount() {
    const res = await fetch('/api/admin/feedback/count', { headers: headers() });
    if (!res.ok) throw new Error(errorFor(res));
    $('count').textContent = `待处理 ${(await res.json()).pending} 条`;
  }
  function originalLink(url) {
    try {
      const parsed = new URL(url);
      return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : null;
    } catch (e) { return null; }
  }
  async function post(path, body) {
    const init = { method: 'POST', headers: headers() };
    if (body) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(body);
    }
    const res = await fetch(path, init);
    let data = null;
    try { data = await res.json(); } catch (e) { /* 出错时可能不是 JSON */ }
    if (!res.ok) throw new Error((data && typeof data.detail === 'string' && data.detail) || errorFor(res));
    return data;
  }
  // 每次操作完（成功或失败）整张卡片按这条记录的状态重画，在按钮旁写一句结果；
  // 操作进行时整张卡片的按钮和输入框都锁住，同一条不会有两个请求同时在走
  // draft：提交失败时带回下拉框和说明框里当时的内容，重画后不用重填
  function render(item, note, failed, draft) {
    const card = el('section', 'card');
    const meta = el('div', 'meta');
    const state = el('span', item.handledAt ? 'tag handled' : 'tag', item.handledAt ? '已处理' : '待处理');
    meta.append(el('span', 'tag', item.kind), el('span', '', new Date(item.createdAt).toLocaleString('zh-CN')), state);
    const content = el('div', 'content', item.content);
    const docLine = el('div', 'document');
    const href = item.docUrl && originalLink(item.docUrl);
    if (item.docTitle && href) {
      const link = el('a', '', item.docTitle);
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      docLine.append('对应文件：', link);
    } else {
      docLine.textContent = item.docId ? '对应文件原文链接不可用' : '无对应文件或文件已删除';
    }
    // 纠错分诊：每轮定时任务用规则和 AI 复查对应文件已发布的截止日期（纠错内容不发给 AI）
    const triage = el('div', 'triage');
    if (item.triageNote) triage.textContent = `自动复查：${item.triageNote}`;
    else if (item.docId && !item.handledAt) triage.textContent = '自动复查：还没做，下一轮定时任务会复查对应文件';
    else triage.hidden = true;
    const CHECK = { pass: '通过', unchecked: '未检查（开发环境不调用微信接口）' };
    const check = el('div', 'meta', `内容安全检查：${CHECK[item.checkResult] || item.checkResult}`);
    // 处理结果（差距清单 C1）：提交的人在“我的数据”里看到的就是这里的结果和说明
    const outcome = el('div', 'meta');
    if (!item.handledAt) outcome.hidden = true;
    else if (item.outcomeLabel) outcome.textContent = `处理结果：${item.outcomeLabel}${item.reply ? `；给用户的说明：${item.reply}` : ''}`;
    else outcome.textContent = '处理结果：没有记录（以前标记的，用户那边只显示“已处理”；要补就选好结果再保存）';
    const form = el('div', 'row');
    const select = el('select');
    select.setAttribute('aria-label', '处理结果');
    select.append(new Option('选择处理结果', ''));
    for (const choice of item.outcomeChoices || []) select.append(new Option(choice.label, choice.value));
    select.value = draft ? draft.outcome : item.outcome || '';
    const reply = el('input');
    reply.type = 'text';
    reply.maxLength = 200;
    reply.size = 34;
    reply.placeholder = item.kind === '支付问题' ? '写一句怎么解决的（必填，最多 200 字）' : '给用户的说明（可不填，最多 200 字）';
    reply.setAttribute('aria-label', '给用户的说明');
    reply.value = draft ? draft.reply : item.reply || '';
    const save = el('button', item.handledAt ? '' : 'primary', item.handledAt ? '保存修改' : '标记已处理');
    form.append(select, reply, save);
    const row = el('div', 'row');
    const msg = el('span', note && !failed ? 'msg ok' : 'msg', note || '');
    function lock() {
      card.querySelectorAll('button, select, input').forEach((node) => { node.disabled = true; });
      msg.className = 'msg';
      msg.textContent = '正在提交…';
      listBusy(1);
    }
    function done(text) {
      card.replaceWith(render(item, text));
      listBusy(-1);
      refreshCount().catch(() => { /* 状态已保存，计数下次载入时更新 */ });
    }
    function fail(err) {
      card.replaceWith(render(item, err.message, true, { outcome: select.value, reply: reply.value }));
      listBusy(-1);
    }
    save.onclick = async () => {
      const hint = !select.value ? '先选处理结果'
        : select.value === 'resolved' && !reply.value.trim() ? '选“已处理”时要写一句给用户的说明' : '';
      if (hint) {
        msg.className = 'msg';
        msg.textContent = hint;
        return;
      }
      lock();
      try {
        const data = await post(`/api/admin/feedback/${item.id}/handle`, { outcome: select.value, reply: reply.value });
        const first = !item.handledAt;
        item.handledAt = item.handledAt || new Date().toISOString();
        Object.assign(item, { outcome: data.outcome, outcomeLabel: data.outcomeLabel, reply: data.reply });
        done(first ? '已处理，用户在“我的数据”里能看到结果' : data.changed ? '已保存修改' : '没有改动');
      } catch (err) { fail(err); }
    };
    // 送过天数的不能撤回（天数不收回）；要改结果直接选采纳类的结果保存
    const undo = el('button', '', '撤回');
    undo.hidden = !item.handledAt || Boolean(item.rewardKind);
    undo.onclick = async () => {
      lock();
      try {
        await post(`/api/admin/feedback/${item.id}/unhandle`);
        Object.assign(item, { handledAt: null, outcome: null, outcomeLabel: null, reply: null });
        done('已撤回，处理结果和说明已清掉');
      } catch (err) { fail(err); }
    };
    const rewardText = (days, rewardNote) => `已发奖 ${days} 天${rewardNote ? `（${rewardNote}）` : ''}`;
    const rewardState = el('span', 'meta', item.rewardKind ? rewardText(item.rewardDays, item.rewardNote) : '尚未发奖');
    // 纠错送 1 天有单独开关（D-070 ⑦）；"已接入并送 3 天"只跟旧的奖励总开关。支付问题不发奖。
    // 发奖同时标记已处理，结果按表单里选的记（只能是采纳类的），没选时记成“已更正”“已接入”
    const choices = [
      ...(item.correctionRewardEnabled && item.kind === '纠错' ? [['correction', '采纳并送 1 天']] : []),
      ...(item.rewardsEnabled && item.kind === '申请覆盖' ? [['source', '已接入并送 3 天']] : []),
    ];
    // 采纳标准和小程序纠错页公开的一致：每人每月最多 3 天，超过的记零天
    const criteria = el('div', 'meta', '采纳标准：第一个指出、经核对属实的事实错误（日期、链接、名单状态等）；重复的、核对不了的不算。每人每月最多 3 天。');
    criteria.hidden = !choices.some(([kind]) => kind === 'correction');
    for (const [kind, label] of choices) {
      const button = el('button', '', label);
      button.disabled = Boolean(item.rewardKind);
      button.onclick = async () => {
        lock();
        try {
          // 表单里当时选的结果和写的说明和发奖一起存；没选结果时按"已更正""已接入"记
          const body = await post(`/api/admin/feedback/${item.id}/reward/${kind}`, { outcome: select.value || null, reply: reply.value });
          Object.assign(item, {
            rewardKind: kind,
            rewardDays: body.days,
            rewardNote: body.note,
            handledAt: item.handledAt || new Date().toISOString(),
            outcome: body.outcome,
            outcomeLabel: body.outcomeLabel,
            reply: body.reply,
          });
          done(body.message + (body.note ? `；${body.note}` : ''));
        } catch (err) { fail(err); }
      };
      row.append(button);
    }
    row.append(undo, rewardState, msg);
    card.append(meta, content, docLine, triage, check, outcome, form, criteria, row);
    return card;
  }
  async function load(reset) {
    if (reset) { shown.clear(); cursor = null; $('list').textContent = ''; }
    const after = cursor ? `&before_id=${cursor}` : '';
    try {
      const res = await fetch(`/api/admin/feedback?status=${$('status').value}&limit=20${after}`, { headers: headers() });
      if (!res.ok) throw new Error(errorFor(res));
      const items = await res.json();
      await refreshCount();
      if (!items.length && !after) $('list').append(el('div', 'empty', '没有反馈'));
      items.filter((item) => !shown.has(item.id)).forEach((item) => {
        shown.add(item.id);
        $('list').append(render(item));
      });
      if (items.length) cursor = Math.min(...items.map((item) => item.id));
      $('more').hidden = items.length < 20;
    } catch (err) {
      $('list').append(el('div', 'empty', err.message));
      $('more').hidden = true;
    }
  }
  $('load').onclick = () => load(true);
  $('status').onchange = () => load(true);
  $('more').onclick = () => load(false);
})();
</script>
</body>
</html>
