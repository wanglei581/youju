<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>周报 · 有据</title>
<style>
:root{--brand:#1769aa;--bg:#f6f7f9;--ink:#222b35;--muted:#687482;--line:#e4e7e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1000px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:20px}.auth{display:flex;gap:8px;margin-left:auto}
main{max-width:1000px;margin:auto;padding:16px}.panel{padding:20px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}h2{font-size:20px}h3{font-size:16px}
input,select,textarea,button{font:inherit;border:1px solid #ccd2d9;border-radius:6px;padding:7px 10px;background:#fff;color:var(--ink)}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}#message{color:#a32a26}a{color:var(--brand)}label{display:inline-block;margin:6px 0}textarea{width:100%}fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0}fieldset label{margin-right:12px}#preview{overflow-wrap:anywhere;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}[hidden]{display:none!important}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(max-width:600px){main{padding:12px}.panel{padding:14px}.auth{margin-left:0}input{max-width:100%}}
</style>
</head>
<body>
<header><div class="bar"><h1>周报</h1><span id="count" class="muted"></span><div class="auth"><input id="token" type="password" placeholder="管理口令" aria-label="管理口令" autocomplete="off"><button id="load" class="primary">载入</button></div></div></header>
<main>
<p class="muted">周报套固定模板生成，复制到公众号后台后人工发布；“已发布”仅记录状态。默认统计上一个完整自然周。</p>
<p id="message" role="status" aria-live="polite"></p>
<section class="panel"><div class="toolbar"><label>方案 <select id="profileFilter"><option value="">全部</option></select></label><button id="edit">查看 / 编辑方案</button><button id="new" disabled>新增方案</button></div>
<div class="toolbar"><label>统计周周一 <input id="week" type="date"></label><button id="generate" class="primary">生成草稿</button><span class="muted">请先选择方案；留空生成上周。</span></div></section>
<div id="issues"></div><button id="more" hidden>加载更多</button>
<section id="detail" class="panel" hidden><h2 id="issueTitle"></h2><p id="issueMeta" class="muted"></p><div class="toolbar"><button id="copyHtml">复制正文（带格式）</button><button id="copyText">复制纯文本</button><button id="copyLinks">复制带链接版</button><button id="copyTitle">复制标题</button><button id="publish"></button><button id="regenerate">重新生成</button><button id="close">关闭预览</button></div><label>备注 <textarea id="note" maxlength="500" rows="2"></textarea></label><button id="saveNote">保存备注</button><div id="preview" tabindex="0" aria-label="周报正文预览"></div></section>
<section id="profilePanel" class="panel" hidden><h2 id="profileHeading">编辑方案</h2><form id="profileForm"><label>名称 <input id="profileName" required maxlength="80"></label><fieldset><legend>省份（不选表示全国，国家部委始终包含）</legend><div id="provinces"></div></fieldset><label style="display:block">关键词（标题包含任一词，每行一个；留空不筛选）<textarea id="keywords" rows="3"></textarea></label><fieldset><legend>栏目</legend><div id="columns"></div></fieldset><label>生成星期 <select id="weekday"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></label> <label><input id="enabled" type="checkbox">启用自动生成</label><p><button id="saveProfile" class="primary">保存方案</button> <button id="cancelProfile" type="button">取消</button></p></form></section>
</main>
<script src="/admin/embed.js"></script>
<script>
(() => {
  const $=id=>document.getElementById(id), labels={applications:'本周申报通知',deadlines:'未来 30 天截止',lists:'本周名单',policies:'本周政策文件'};
  let profiles=[],provinceNames=[],selected=null,editing=null,offset=0,sequence=0;
  function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
  function stamp(value){return new Date(value).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});}
  async function api(path,options={}){const r=await fetch(`/api/admin/weekly${path}`,{...options,cache:'no-store',headers:{'X-Admin-Token':youjuAdminToken(),'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:`操作失败（${r.status}），请检查输入和管理口令`);return d;}
  async function action(button,work){button.disabled=true;$('message').textContent='';try{await work();}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}}
  function close(){selected=null;$('detail').hidden=true;$('preview').replaceChildren();}
  async function loadIssues(reset=true){const seq=++sequence;if(reset){offset=0;close();$('issues').replaceChildren();}$('more').disabled=true;try{const p=new URLSearchParams({offset:String(offset)});if($('profileFilter').value)p.set('profile_id',$('profileFilter').value);const d=await api(`/issues?${p}`);if(seq!==sequence)return;d.items.forEach(item=>{const card=node('section');card.className='panel';card.append(node('h3',item.title),node('p',`${item.status==='published'?'已发布':'草稿'} · ${stamp(item.generated_at)} · ${Object.entries(item.counts).map(([k,v])=>`${labels[k]} ${v} 条`).join('；')}`));const open=node('button','预览');open.onclick=()=>action(open,()=>showIssue(item.id));const status=node('button',item.status==='published'?'撤回':'标为已发布');status.onclick=()=>action(status,async()=>{await api(`/issues/${item.id}/status`,{method:'POST',body:JSON.stringify({status:item.status==='published'?'draft':'published',note:item.note})});await loadIssues();});const regenerate=node('button','重新生成');regenerate.disabled=item.status==='published';regenerate.onclick=()=>action(regenerate,()=>regenerateIssue(item.id));card.append(open,status,regenerate);$('issues').append(card);});offset+=d.items.length;$('count').textContent=`共 ${d.total} 期`;$('more').hidden=offset>=d.total;if(!d.total)$('issues').append(node('p','暂无周报。请选择方案生成草稿。'));}finally{$('more').disabled=false;}}
  async function load(){const keep=$('profileFilter').value;const d=await api('/profiles');profiles=d.items;provinceNames=d.provinces;$('new').disabled=false;$('profileFilter').replaceChildren(node('option','全部'));profiles.forEach(p=>{const o=node('option',p.name);o.value=p.id;$('profileFilter').append(o);});$('profileFilter').value=keep;await loadIssues();}
  async function showIssue(id){const d=await api(`/issues/${id}`);selected=d;$('issueTitle').textContent=d.title;$('issueMeta').textContent=`${d.status==='published'?'已发布':'草稿'} · ${stamp(d.generated_at)}`;$('note').value=d.note;$('publish').textContent=d.status==='published'?'撤回':'标为已发布';$('regenerate').disabled=d.status==='published';$('preview').innerHTML=d.body_html;$('detail').hidden=false;$('detail').scrollIntoView({behavior:'smooth'});}
  async function regenerateIssue(id){const d=await api(`/issues/${id}/regenerate`,{method:'POST'});await loadIssues();$('message').textContent=d.reason;if(d.issue_id && d.outcome==='generated')await showIssue(d.issue_id);}
  function checkbox(container,label,value,checked){const l=node('label'),box=node('input');box.type='checkbox';box.value=value;box.checked=checked;l.append(box,document.createTextNode(label));container.append(l);}
  function editProfile(profile){editing=profile?profile.id:null;$('profileHeading').textContent=profile?'编辑方案':'新增方案';$('profileName').value=profile?profile.name:'';$('keywords').value=profile?profile.keywords.join('\n'):'';$('weekday').value=profile?profile.weekday:1;$('enabled').checked=profile?profile.enabled:true;$('provinces').replaceChildren();provinceNames.forEach(p=>checkbox($('provinces'),p,p,!!profile?.provinces.includes(p)));$('columns').replaceChildren();Object.entries(labels).forEach(([k,v])=>checkbox($('columns'),v,k,profile?!!profile.columns[k]:true));$('profilePanel').hidden=false;$('profilePanel').scrollIntoView({behavior:'smooth'});}
  function manualCopy(html){$('preview').innerHTML=html;const range=document.createRange();range.selectNodeContents($('preview'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('preview').focus();$('message').textContent='浏览器不支持复制带格式正文，已选中预览，请手动复制（Ctrl/Cmd+C）。';}
  async function copy(kind){if(!selected)return;const d=await api(`/issues/${selected.id}`);selected=d;if(kind==='html'){if(!window.isSecureContext || !navigator.clipboard?.write || !window.ClipboardItem){manualCopy(d.body_html);return;}try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([d.body_html],{type:'text/html'}),'text/plain':new Blob([d.body_text],{type:'text/plain'})})]);}catch(_){manualCopy(d.body_html);return;}}else{const value=kind==='title'?d.title:kind==='links'?d.body_text_with_links:d.body_text;if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(value);}catch(_){showPlain(value);return;}}else{showPlain(value);return;}}$('message').textContent='已复制';}
  function showPlain(value){const area=node('textarea');area.value=value;area.readOnly=true;area.rows=8;$('preview').replaceChildren(area);area.focus();area.select();$('message').textContent='浏览器不支持自动复制，已选中文本，请手动复制（Ctrl/Cmd+C）。';}
  $('load').onclick=()=>action($('load'),load);$('profileFilter').onchange=()=>action($('load'),()=>loadIssues());$('more').onclick=()=>action($('more'),()=>loadIssues(false));$('new').onclick=()=>editProfile(null);$('edit').onclick=()=>{const p=profiles.find(p=>String(p.id)===$('profileFilter').value);if(p)editProfile(p);else $('message').textContent='请先选择方案';};$('cancelProfile').onclick=()=>$('profilePanel').hidden=true;
  $('profileForm').onsubmit=e=>{e.preventDefault();action($('saveProfile'),async()=>{const columns={};$('columns').querySelectorAll('input').forEach(box=>columns[box.value]=box.checked);const body={name:$('profileName').value.trim(),provinces:Array.from($('provinces').querySelectorAll('input:checked'),box=>box.value),keywords:$('keywords').value.split('\n').map(s=>s.trim()).filter(Boolean),columns,weekday:Number($('weekday').value),enabled:$('enabled').checked};const p=await api(editing?`/profiles/${editing}`:'/profiles',{method:editing?'PUT':'POST',body:JSON.stringify(body)});$('profilePanel').hidden=true;await load();$('profileFilter').value=p.id;await loadIssues();$('message').textContent='方案已保存';});};
  $('generate').onclick=()=>action($('generate'),async()=>{const profile_id=Number($('profileFilter').value);if(!profile_id)throw new Error('请先选择方案');const d=await api('/generate',{method:'POST',body:JSON.stringify({profile_id,week:$('week').value||null})});await loadIssues();$('message').textContent=d.reason;if(d.issue_id && d.outcome==='generated')await showIssue(d.issue_id);});
  $('publish').onclick=()=>action($('publish'),async()=>{const id=selected.id;await api(`/issues/${id}/status`,{method:'POST',body:JSON.stringify({status:selected.status==='published'?'draft':'published',note:$('note').value})});await loadIssues();await showIssue(id);});$('saveNote').onclick=()=>action($('saveNote'),async()=>{await api(`/issues/${selected.id}/status`,{method:'POST',body:JSON.stringify({status:selected.status,note:$('note').value})});$('message').textContent='备注已保存';});$('regenerate').onclick=()=>action($('regenerate'),()=>regenerateIssue(selected.id));$('close').onclick=close;
  [['copyHtml','html'],['copyText','text'],['copyLinks','links'],['copyTitle','title']].forEach(([id,kind])=>$(id).onclick=()=>action($(id),()=>copy(kind)));
})();
</script>
</body>
</html>
