<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>类型待定 · 有据</title>
<style>
  :root {
    --brand: #2A5CE0; --brand-tint: #EAF0FF; --bg: #F2F4F8; --card: #FFFFFF;
    --t1: #1D2129; --t2: #4E5969; --t3: #86909C; --line: #EEF0F3; --line2: #E5E6EB;
    --green: #0E8A63; --g-tint: #E8F7F1; --orange: #D9640F; --o-tint: #FFF3E8; --red: #E5484D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1); font: 15px/1.6 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 880px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 18px; }
  a { color: var(--brand); }
  .count, .meta, .hint { color: var(--t2); font-size: 14px; }
  .auth { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; color: var(--t1); }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line2); background: #fff; color: var(--t1); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  main { max-width: 880px; margin: 0 auto; padding: 16px; }
  .hint { margin: 0 0 12px; }
  .row, .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .filters { margin-bottom: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .meta { font-size: 13px; }
  .title { display: block; margin: 8px 0 4px; font-size: 16px; font-weight: 600; color: var(--t1); text-decoration: none; }
  .title:hover { color: var(--brand); }
  .judge { margin: 10px 0; padding: 10px 12px; background: #F7F8FA; border-radius: 8px; font-size: 14px; }
  .judge b { font-weight: 600; }
  .reason { color: var(--t2); }
  .tag { padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .decided { background: var(--g-tint); color: var(--green); }
  .msg { font-size: 13px; color: var(--red); }
  .ok { color: var(--green); }
  .empty { text-align: center; color: var(--t2); padding: 48px 0; }
  .more { display: block; margin: 8px auto 32px; }
  [hidden] { display: none !important; } /* 带 display 的样式会盖过 hidden 属性 */
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>类型待定</h1>
    <span class="count" id="count"></span>
    <a href="/admin/kind-suggest">类型建议</a>
    <a href="/admin/review">截止日期核对台</a>
    <a href="/admin/audit">质检存疑</a>
    <a href="/admin/feedback">纠错与申请覆盖</a>
    <a href="/admin/sources">来源接入</a>
    <div class="auth">
      <input id="reviewer" placeholder="核对人" size="8" aria-label="核对人">
      <input id="token" type="password" placeholder="管理口令" size="16" aria-label="管理口令">
      <button class="primary" id="load">载入</button>
    </div>
  </div>
</header>
<main>
  <p class="hint">这些文件 AI 和标题规则判断的类型不一样（AI 只分四类，规则判“资讯与指南”、AI 判“其他”的算一致）。点开原文看一眼，选定类型：选定后搜索页签、筛选和导出都按你选的；名单类文件还会去解析名单。点错了可以撤回。管理口令只保存在当前页面，刷新后需重新输入。</p>
  <div class="row filters">
    <label for="status">显示</label>
    <select id="status"><option value="pending">待定</option><option value="all">全部（含已定）</option></select>
  </div>
  <div id="list"></div>
  <button class="more" id="more" hidden>再载入 20 条</button>
</main>
<script src="/admin/embed.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KINDS = ['申报通知', '名单', '政策', '资讯与指南', '其他'];
  const shown = new Set();
  let cursor = null;

  function headers(json) {
    const h = { 'X-Admin-Token': youjuAdminToken() };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }
  function el(tag, cls, value) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (value !== undefined) node.textContent = value;
    return node;
  }
  function errorFor(res) {
    if (res.status === 401 || res.status === 429) return '口令不对、未配置，或输错次数过多';
    if (res.status === 422) return '先在右上角填核对人';
    return `请求失败（${res.status}）`;
  }
  function originalLink(url) {
    try {
      const parsed = new URL(url);
      return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : null;
    } catch (e) { return null; }
  }
  async function refreshCount() {
    const res = await fetch('/api/admin/kinds/count', { headers: headers() });
    if (!res.ok) throw new Error(errorFor(res));
    $('count').textContent = `待定 ${(await res.json()).pending} 份`;
  }
  function render(item) {
    const card = el('section', 'card');
    const meta = el('div', 'meta');
    const state = el('span', 'tag decided', item.decided ? `已定：${item.decided}` : '');
    state.hidden = !item.decided;
    meta.append(el('span', '', `${item.source} · ${item.publish_date || '发布日期不详'} 发布`), state);
    const href = originalLink(item.url);
    const title = el(href ? 'a' : 'span', 'title', item.title);
    if (href) { title.href = href; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
    const judge = el('div', 'judge');
    judge.append('标题规则：', el('b', '', item.rule_kind), '　AI：', el('b', '', item.ai_kind),
      el('span', 'reason', `（把握 ${Math.round(item.ai_confidence * 100)}%${item.ai_reason ? `；${item.ai_reason}` : ''}）`));
    const row = el('div', 'row');
    const msg = el('span', 'msg');
    const buttons = KINDS.map((kind) => el('button', kind === item.ai_kind ? 'primary' : '', kind));
    const undo = el('button', '', '撤回');
    undo.hidden = !item.decided;
    function setBusy(busy) { buttons.concat(undo).forEach((b) => { b.disabled = busy; }); }
    buttons.forEach((button, i) => {
      button.onclick = async () => {
        setBusy(true);
        msg.textContent = '';
        try {
          const res = await fetch(`/api/admin/documents/${item.id}/kind`, {
            method: 'POST', headers: headers(true),
            body: JSON.stringify({ kind: KINDS[i], decided_by: $('reviewer').value.trim() }),
          });
          if (!res.ok) throw new Error(errorFor(res));
          item.decided = KINDS[i];
          state.textContent = `已定：${item.decided}`;
          state.hidden = false;
          undo.hidden = false;
          msg.className = 'msg ok';
          msg.textContent = '已保存，可撤回';
          try { await refreshCount(); } catch (e) { /* 已保存，计数稍后重新载入 */ }
        } catch (err) {
          msg.className = 'msg';
          msg.textContent = err.message;
        } finally { setBusy(false); }
      };
    });
    undo.onclick = async () => {
      setBusy(true);
      msg.textContent = '';
      try {
        const res = await fetch(`/api/admin/documents/${item.id}/kind/undo`, { method: 'POST', headers: headers() });
        if (!res.ok) throw new Error(errorFor(res));
        item.decided = null;
        state.hidden = true;
        undo.hidden = true;
        msg.className = 'msg ok';
        msg.textContent = '已撤回，回到按标题规则判断';
        try { await refreshCount(); } catch (e) { /* 已撤回，计数稍后重新载入 */ }
      } catch (err) {
        msg.className = 'msg';
        msg.textContent = err.message;
      } finally { setBusy(false); }
    };
    row.append(...buttons, undo, msg);
    card.append(meta, title, judge, row);
    return card;
  }
  async function load(reset) {
    if (reset) { shown.clear(); cursor = null; $('list').textContent = ''; }
    const after = cursor ? `&before_id=${cursor}` : '';
    try {
      const res = await fetch(`/api/admin/kinds?status=${$('status').value}&limit=20${after}`, { headers: headers() });
      if (!res.ok) throw new Error(errorFor(res));
      const items = await res.json();
      await refreshCount();
      if (!items.length && !after) $('list').append(el('div', 'empty', '没有要人定的类型（AI 和规则都一致，或 AI 还没检查过）'));
      items.filter((item) => !shown.has(item.id)).forEach((item) => {
        shown.add(item.id);
        $('list').append(render(item));
      });
      if (items.length) cursor = Math.min(...items.map((item) => item.id));
      $('more').hidden = items.length < 20;
    } catch (err) {
      $('list').append(el('div', 'empty', err.message));
      $('more').hidden = true;
    }
  }
  $('load').onclick = () => load(true);
  $('status').onchange = () => load(true);
  $('more').onclick = () => load(false);
})();
</script>
</body>
</html>
