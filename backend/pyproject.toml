[project]
name = "youju-backend"
version = "0.1.0"
description = "有据：数据底座与 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "lxml>=5.2",
    "cssselect>=1.2",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pillow>=11",
    "xlrd>=2.0.1",
    "python-docx>=1.2",
    "pymysql>=1.1",
    "cryptography>=43",
    "olefile>=0.47",
    "libarchive-c>=5.1",
]

[project.scripts]
youju = "youju.cli:main"

[project.optional-dependencies]
# 扫描件识别文字（D-125）：开源的 RapidOCR（模型在安装包里，运行时不下载），只装在跑识别的机器上
# （2.0 的本地电脑）；云托管镜像按锁文件只装主依赖，不装这一组。OpenCV 用不带界面的版本（见下面的
# override-dependencies）
ocr = [
    "rapidocr-onnxruntime==1.4.4",
    "opencv-python-headless>=4.8",
]

[tool.uv]
# rapidocr-onnxruntime 要的是带界面的 opencv-python（精简镜像里缺 libGL 导入就失败），换成上面
# 不带界面的 opencv-python-headless（同一个 cv2 模块）
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youju"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试里的 HTML 片段和自动生成的迁移脚本允许长行
"tests/**" = ["E501"]
"alembic/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
