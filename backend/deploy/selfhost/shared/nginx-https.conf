# 有据（D-126）__DOMAIN__：宝塔的 nginx 转给有据自己的容器（只听本机回环地址）。
# - 只放行小程序接口（/api/v1/）、健康检查、消息推送（/api/wx/push，和 YOUJU_WX_PUSH_PATH 的默认值一致）和本机同步
#   （/api/sync/，转给 worker）；核对台（/admin、/api/admin/）不对外，别的路径一律 404。
# - 不记访问日志（程序自己记，只记路径，见 youju/access_log.py）；出错日志不写。
# - 客户端地址整个覆盖写进 X-Forwarded-For（不信客户端自带的值），程序按 YOUJU_CLIENT_IP_HEADER 取。
# - 宝塔的全局代理配置（proxy.conf）默认开了 proxy_cache 和 404 时换上游重试，这里都关掉：接口回的是各人自己的
#   数据，不能缓存。
# 由 /opt/youju/bin/youju-shared.sh 写进宝塔的站点目录，不经宝塔面板管理；删掉这个文件再重载 nginx 就回到原样。
server {
    listen 80;
    server_name __DOMAIN__;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/youju/acme-webroot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /opt/youju/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /opt/youju/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;

    client_max_body_size 12m;
    gzip_proxied any;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /api/sync/ {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:18101;
    }

    # 本机每 5 分钟从外面看一次定时任务服务还在不在（youju uptime-check）
    location = /health/worker {
        proxy_pass http://127.0.0.1:18101/health;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18100;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18100;
    }

    location = /api/wx/push {
        proxy_pass http://127.0.0.1:18100;
    }

    location / {
        return 404;
    }
}
