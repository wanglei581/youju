# 有据（D-126）__DOMAIN__ 的第一步：只为申请证书（Let's Encrypt 访问 /.well-known/acme-challenge/），别的路径一律 404。
# 由 /opt/youju/bin/youju-shared.sh 写进宝塔的站点目录，不经宝塔面板管理；删掉这个文件再重载 nginx 就回到原样。
server {
    listen 80;
    server_name __DOMAIN__;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/youju/acme-webroot;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
