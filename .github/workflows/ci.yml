name: CI

on:
  pull_request:
  push:
    branches: [main, feat/ai-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miniapp:
    name: 小程序与发布工具（测试 + 体验准备）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 小程序测试
        run: node --test apps/miniapp/tests/*.test.js
      - name: 发布工具回归
        run: |
          node --test tools/tests/*.test.js
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      # 备案办理中可准备体验版；正式提审仍必须运行默认的严格检查。
      - name: 完整候选体验准备检查
        run: node tools/miniapp_presubmit_check.js --profile complete-candidate --mode prepare

  backend:
    name: 后端（代码检查 + 测试）
    runs-on: ubuntu-latest
    services:
      # 线上用微信云托管自带的 MySQL 8.0
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: youju
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pyouju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YOUJU_TEST_DATABASE_URL: mysql+pymysql://root:youju@127.0.0.1:3306/youju_test?charset=utf8mb4
      # CI 里数据库必须可用：连不上直接失败，不允许跳过数据库测试
      YOUJU_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: 安装依赖（按锁文件）
        run: uv sync --locked
      - name: 代码风格
        run: uv run ruff format --check .
      - name: 代码检查
        run: uv run ruff check .
      - name: 测试
        run: uv run pytest

  image:
    name: 镜像构建（云托管用的 Dockerfile）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: youju
          MYSQL_DATABASE: youju_image
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pyouju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # 境外机器上用官方源构建（云托管默认用腾讯云源）；依赖按锁文件校验哈希，装出来的包一样
      - name: 写入构建来源版本
        run: python3 tools/release/write_build.py
      - name: 构建镜像
        run: >-
          docker build -t youju:ci
          --build-arg DEBIAN_MIRROR=deb.debian.org
          --build-arg PIP_INDEX_URL=https://pypi.org/simple .
      # 在容器里按部署顺序跑一遍：建表迁移、导入来源清单。能发现镜像里的路径、文件和依赖问题
      - name: 容器里迁移数据库、导入来源
        run: >-
          docker run --rm --network host
          -e "YOUJU_DATABASE_URL=mysql+pymysql://root:youju@127.0.0.1:3306/youju_image?charset=utf8mb4"
          youju:ci sh -c "youju db-upgrade && youju import-sources && youju report"
      # 按部署方式启动两个服务（start.sh）：admin 迁移、装 cron、写心跳后起接口；api 只起接口。
      # 口令只是 CI 用的假值
      - name: 按部署方式启动 admin、api，健康检查通过
        run: |
          DB="mysql+pymysql://root:youju@127.0.0.1:3306/youju_image?charset=utf8mb4"
          docker run -d --name admin --network host -e PORT=8081 -e YOUJU_ROLE=admin \
            -e YOUJU_ADMIN_TOKEN=ci-dummy-admin-token-0000000000000000 \
            -e "YOUJU_DATABASE_URL=$DB" youju:ci
          docker run -d --name api --network host -e PORT=8082 -e YOUJU_ROLE=api \
            -e YOUJU_TRUST_WX_HEADERS=true -e "YOUJU_DATABASE_URL=$DB" youju:ci
          for port in 8081 8082; do
            curl -fsS --retry 20 --retry-delay 2 --retry-all-errors "http://localhost:$port/health"
            echo
          done
          # 版本响应只含SHA和角色；admin探针仍要求云调用头，不向公网开放。
          curl -fsS -H 'X-WX-SOURCE: ci' http://localhost:8081/api/v1/version > /tmp/admin-version.json
          curl -fsS http://localhost:8082/api/v1/version > /tmp/api-version.json
          python3 -c 'import json, os; assert all(json.load(open("/tmp/" + role + "-version.json")) == {"revision": os.environ["GITHUB_SHA"], "role": role} for role in ("admin", "api"))'
          docker exec admin crontab -l
          # 定时任务按北京时间跑：容器的系统时区是 +0800
          test "$(docker exec admin date +%z)" = "+0800"
          docker exec admin test -s /app/backend/deploy/env.sh
          docker exec admin test -x /app/backend/deploy/first-round.sh
      - name: 启动失败时打印容器日志
        if: failure()
        run: docker logs admin || true; docker logs api || true
