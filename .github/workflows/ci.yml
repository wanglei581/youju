name: CI

on:
  pull_request:
  push:
    branches: [main, feat/ai-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miniapp:
    name: 小程序与发布工具（测试 + 体验准备）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 小程序测试
        run: node --test apps/miniapp/tests/*.test.js
      - name: 发布工具回归
        run: |
          node --test tools/tests/*.test.js
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      # 备案办理中可准备体验版；正式提审仍必须运行默认的严格检查。
      - name: 完整正式包体验准备检查
        run: node tools/miniapp_presubmit_check.js --profile complete-release --mode prepare

  backend:
    name: 后端（代码检查 + 测试）
    runs-on: ubuntu-latest
    # 11/4 起平时 26–30 分钟（测试 5000 多项），同时跑的多时会到 40 分钟被取消（#437）；
    # 卡住时不按 GitHub 默认跑满 6 小时
    timeout-minutes: 60
    services:
      # 线上用微信云托管自带的 MySQL 8.0
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: youju
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pyouju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YOUJU_TEST_DATABASE_URL: mysql+pymysql://root:youju@127.0.0.1:3306/youju_test?charset=utf8mb4
      # CI 里数据库必须可用：连不上直接失败，不允许跳过数据库测试
      YOUJU_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: 安装依赖（按锁文件）
        run: uv sync --locked
      - name: 代码风格
        run: uv run ruff format --check .
      - name: 代码检查
        run: uv run ruff check .
      - name: 测试
        run: uv run pytest

  # 扫描页识别（D-125）：识别组件是可选的一组依赖（uv sync --extra ocr），平时的测试和云托管镜像都
  # 不装。这里装上跑真识别的测试（子进程有内存上限，Linux 上管用），量 Linux 上的用时、内存和装出来
  # 多大；再在和云托管同一个基础镜像里装一遍、识别一遍，看缺不缺系统库（pip 要加 --no-deps：锁文件
  # 里已经是全部依赖，rapidocr 要的带界面的 OpenCV 由 uv 换成了不带界面的，pip 不认这个替换）
  ocr:
    name: 扫描页识别（装识别组件：真识别、用时、内存、大小）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: 安装依赖和识别组件（按锁文件），量识别组件装出来多大
        run: |
          uv sync --locked
          site=$(uv run --no-sync python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          before=$(du -sk "$site" | cut -f1)
          uv sync --locked --extra ocr
          after=$(du -sk "$site" | cut -f1)
          echo "识别组件装出来多 $(( (after - before) / 1024 ))MB"
      - name: 真识别的测试
        run: uv run --no-sync pytest tests/test_attachment_ocr.py -k real -s -q
      - name: 用时和内存（单线程，本进程；再在限内存的子进程里走一遍）
        run: |
          uv run --no-sync python scripts/ocr_measure.py --pages 3 --threads 1
          uv run --no-sync python scripts/ocr_measure.py --pages 3 --threads 1 --sandbox
      - name: 和云托管同一个基础镜像里装得上、识别得了
        run: |
          base=$(sed -n 's/^FROM \(python:[^ ]*\).*/\1/p' ../Dockerfile | head -1)
          docker run --rm -v "$PWD":/src -w /src "$base" sh -c '
            pip install -q --no-cache-dir uv==0.12.5 &&
            uv export --frozen --no-dev --no-emit-project --extra ocr -o /tmp/req.txt &&
            pip install -q --no-cache-dir --no-deps --require-hashes -r /tmp/req.txt &&
            pip install -q --no-cache-dir --no-deps -e . &&
            python scripts/ocr_measure.py --pages 2 --sandbox'

  image:
    name: 镜像构建（云托管用的 Dockerfile）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: youju
          MYSQL_DATABASE: youju_image
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pyouju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # 境外机器上用官方源构建（云托管默认用腾讯云源）；依赖按锁文件校验哈希，装出来的包一样
      - name: 写入构建来源版本
        run: python3 tools/release/write_build.py
      - name: 构建镜像
        run: >-
          docker build -t youju:ci
          --build-arg DEBIAN_MIRROR=deb.debian.org
          --build-arg PIP_INDEX_URL=https://pypi.org/simple .
      # 在容器里按部署顺序跑一遍：建表迁移、导入来源清单。能发现镜像里的路径、文件和依赖问题
      - name: 容器里迁移数据库、导入来源
        run: >-
          docker run --rm --network host
          -e "YOUJU_DATABASE_URL=mysql+pymysql://root:youju@127.0.0.1:3306/youju_image?charset=utf8mb4"
          youju:ci sh -c "youju db-upgrade && youju import-sources && youju report"
      # rar 附件靠系统库 libarchive 解压：镜像里要装上、Python 能加载，并且认得 rar、rar5
      - name: 容器里能加载 libarchive（解 rar 附件）
        run: >-
          docker run --rm youju:ci python -c
          "import libarchive.ffi as f; f.get_read_format_function('rar'); f.get_read_format_function('rar5'); print(f.libarchive_path, f.version_number())"
      # 读 PDF 在限内存、限时的子进程里（youju/pdf_sandbox.py）：镜像里子进程要起得来、设得上内存上限，
      # 现做的小 PDF 读得出字。不然线上每份 PDF 都按"起不了子进程"等着重试
      - name: 容器里读 PDF 的子进程起得来、有内存上限
        run: |
          docker run --rm -i youju:ci python - <<'PY'
          import json, resource, subprocess, sys, zlib
          from youju import pdf_sandbox
          text = b"BT /F1 12 Tf 20 100 Td (Notice 2026) Tj ET"
          raw = zlib.compress(text)
          objs = [b"<< /Type /Catalog /Pages 2 0 R >>", b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
                  b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 300 200] /Contents 4 0 R"
                  b" /Resources << /Font << /F1 5 0 R >> >> >>",
                  b"<< /Length %d /Filter /FlateDecode >>\nstream\n" % len(raw) + raw + b"\nendstream",
                  b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"]
          pdf, offsets = b"%PDF-1.4\n", []
          for n, body in enumerate(objs, 1):
              offsets.append(len(pdf))
              pdf += b"%d 0 obj\n" % n + body + b"\nendobj\n"
          xref = len(pdf)
          pdf += b"xref\n0 6\n0000000000 65535 f \n" + b"".join(b"%010d 00000 n \n" % o for o in offsets)
          pdf += b"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % xref
          assert pdf_sandbox.read("body", pdf, seconds=60, pages=200) == {"pages": 1, "text": "Notice 2026"}
          cfg = {"memory": pdf_sandbox.MEMORY_MAX, "output": pdf_sandbox.OUTPUT_MAX, "cpu": 60}
          code = ("import json, resource, sys; sys.path.insert(0, sys.argv[1]); from youju import pdf_sandbox;"
                  " pdf_sandbox._limit(json.loads(sys.argv[2])); print(resource.getrlimit(resource.RLIMIT_AS)[0])")
          got = subprocess.run([sys.executable, "-I", "-c", code, str(pdf_sandbox._ROOT), json.dumps(cfg)],
                               capture_output=True, text=True, check=True).stdout.strip()
          assert int(got) == pdf_sandbox.MEMORY_MAX, got
          print("pdf_sandbox ok, RLIMIT_AS", got)
          PY
      # 按部署方式启动两个服务（start.sh）：admin 迁移、装 cron、写心跳后起接口；api 只起接口。
      # 口令只是 CI 用的假值
      - name: 按部署方式启动 admin、api，健康检查通过
        run: |
          DB="mysql+pymysql://root:youju@127.0.0.1:3306/youju_image?charset=utf8mb4"
          docker run -d --name admin --network host -e PORT=8081 -e YOUJU_ROLE=admin \
            -e YOUJU_ADMIN_TOKEN=ci-dummy-admin-token-0000000000000000 \
            -e "YOUJU_DATABASE_URL=$DB" youju:ci
          docker run -d --name api --network host -e PORT=8082 -e YOUJU_ROLE=api \
            -e YOUJU_TRUST_WX_HEADERS=true -e "YOUJU_DATABASE_URL=$DB" youju:ci
          for port in 8081 8082; do
            curl -fsS --retry 20 --retry-delay 2 --retry-all-errors "http://localhost:$port/health"
            echo
          done
          # 版本响应只含SHA和角色；admin探针仍要求云调用头，不向公网开放。
          curl -fsS -H 'X-WX-SOURCE: ci' http://localhost:8081/api/v1/version > /tmp/admin-version.json
          curl -fsS http://localhost:8082/api/v1/version > /tmp/api-version.json
          python3 -c 'import json, os; assert all(json.load(open("/tmp/" + role + "-version.json")) == {"revision": os.environ["GITHUB_SHA"], "role": role} for role in ("admin", "api"))'
          docker exec admin crontab -l
          # 定时任务按北京时间跑：容器的系统时区是 +0800
          test "$(docker exec admin date +%z)" = "+0800"
          docker exec admin test -s /app/backend/deploy/env.sh
          docker exec admin test -x /app/backend/deploy/first-round.sh
      - name: 启动失败时打印容器日志
        if: failure()
        run: docker logs admin || true; docker logs api || true
