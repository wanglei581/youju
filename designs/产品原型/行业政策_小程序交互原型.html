<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>行业政策 · 小程序交互原型</title>
  <style>
    :root{--ink:#172b2a;--deep:#0b3633;--mid:#164945;--paper:#f5f3ee;--white:#fff;--line:#e1e7df;--muted:#657a73;--copper:#b96f4b;--copper-soft:#f6e9df;--ok:#276f53;--ok-soft:#e2f0e7;--warn:#a75132;--warn-soft:#fcefe7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);background:#dfe7e1}button,input,select{font:inherit}button{cursor:pointer}#stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 16px}.review-bar{width:min(100%,980px);background:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 12px 32px #193c3020}.review-bar strong{font-size:15px}.review-bar small{color:#66766e}.review-bar .spacer{flex:1}.review-bar button,.review-bar select{border:1px solid #d5e1d6;background:#fff;color:#21483e;border-radius:11px;padding:8px 12px;font-size:13px}.review-bar button.active{background:var(--deep);color:#fff}.workbench{width:min(100%,980px);display:flex;justify-content:center;align-items:flex-start;gap:24px}.review-notes{width:250px;background:#fff;border-radius:20px;padding:20px;line-height:1.65;font-size:13px;color:#52685e}.review-notes h2{margin:0 0 12px;color:var(--deep);font-size:17px}.review-notes ol{padding-left:19px}.review-notes li+li{margin-top:9px}.review-notes .label{display:inline-block;border-radius:8px;background:#f2eee7;padding:3px 8px;color:#825236;font-size:12px}.phone{width:390px;height:844px;max-height:calc(100vh - 120px);min-height:620px;background:var(--paper);border:8px solid #142c2a;border-radius:44px;box-shadow:0 28px 70px #11372d35;overflow:hidden;display:flex;flex-direction:column;position:relative}.phone-top{height:12px;background:var(--paper);flex:none}.phone main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:13px 17px 85px;scrollbar-width:thin}.phone nav{position:absolute;bottom:0;left:0;right:0;height:69px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:4}.phone nav button{border:0;background:transparent;color:#7d8e87;font-size:11px;display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center}.phone nav button span{font:800 21px "Songti SC",serif}.phone nav button.active{color:var(--deep)}.eyebrow{letter-spacing:.22em;font-size:10px;font-weight:800;color:var(--copper)}h1,h2,h3,p{margin-top:0}.serif{font-family:"Songti SC","STSong","Noto Serif SC",serif}.hero{background:var(--deep);color:#fff;border-radius:22px;padding:23px 23px 20px;min-height:193px;box-shadow:0 12px 25px #0b363329}.hero .eyebrow{color:#e7c8ad}.hero h1{font-size:31px;line-height:1.15;margin:13px 0 9px}.hero p{font-size:12px;line-height:1.65;color:#d2e2d8;margin:0}.hero-foot{display:flex;justify-content:space-between;margin-top:15px;font-size:10px;color:#b8d0c1}.section-head{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 12px}.section-head h2{font:800 20px "Songti SC",serif;color:var(--deep);margin:0}.section-head button,.text-link{border:0;background:none;color:var(--mid);font-size:12px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 11px;box-shadow:0 3px 12px #1c443109}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;border:1px solid #d8e1d7;border-radius:11px;background:#fbfcf9;padding:11px;font-size:13px}.button{border:0;border-radius:12px;background:var(--mid);color:#fff;padding:10px 14px;font-size:12px;font-weight:700}.button.secondary{background:#e8efe8;color:var(--deep)}.button.outline{border:1px solid #cbdacf;background:#fff;color:var(--mid)}.button.small{padding:7px 10px;font-size:11px}.button:disabled{opacity:.45}.filters{display:flex;gap:6px;overflow:auto;margin-top:11px}.chip{white-space:nowrap;border:1px solid #dce5dc;background:#fff;border-radius:999px;color:#536d5f;padding:7px 10px;font-size:11px}.chip.active{background:#e6eee7;color:var(--mid);border-color:#a8c3b1}.task-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.task{border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 9px;text-align:left;font-size:11px;color:var(--ink)}.task b{display:flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:8px;background:#e8efe8;color:var(--mid);font:800 16px serif;margin-bottom:7px}.notice{padding:11px 12px;border-radius:12px;background:#eaf1e9;color:#416656;font-size:11px;line-height:1.6;margin:10px 0}.notice.warn{background:var(--warn-soft);color:var(--warn)}.notice.copper{background:var(--copper-soft);color:#805438}.result-head{display:flex;align-items:flex-start;gap:8px}.check{width:19px;height:19px;border:1.5px solid #87a596;border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:12px}.check.on{background:var(--mid);border-color:var(--mid)}.result-title{flex:1;font-size:15px;line-height:1.5;font-weight:750}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{padding:3px 7px;border-radius:999px;background:#eef1ed;color:#597063;font-size:10px;font-weight:700}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.copper{background:var(--copper-soft);color:#925d40}.answer{background:#f5f8f4;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}.answer b{color:var(--mid)}.source-line{border-top:1px solid #eef1ec;margin-top:12px;padding-top:9px;display:flex;justify-content:space-between;color:#66786d;font-size:10px}.selection{position:absolute;bottom:69px;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 18px #0b363318;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;z-index:5;font-size:12px}.selection button{margin-left:5px}.back{border:0;background:transparent;color:var(--mid);font-weight:700;padding:3px 0 14px;font-size:13px}.detail-title{font:800 25px/1.4 "Songti SC",serif;color:var(--deep);margin:8px 0 12px}.detail-row{display:flex;justify-content:space-between;border-bottom:1px solid #eef1ec;padding:9px 0;gap:12px;font-size:11px}.detail-row span:first-child{color:var(--muted);flex:none}.detail-row span:last-child{text-align:right}.action-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;background:#fff;border:1px dashed #d7e1d7;border-radius:18px;padding:45px 20px;color:#62766a}.empty b{display:block;color:var(--deep);font-size:17px;margin-bottom:8px}.empty p{font-size:12px;line-height:1.6}.list-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef1ec;font-size:12px}.list-row:last-child{border:0}.list-row small{display:block;color:var(--muted);margin-top:4px}.top-title{font:800 31px "Songti SC",serif;color:var(--deep);margin:4px 0 5px}.top-sub{font-size:12px;color:var(--muted);line-height:1.6}.mode-admin{width:min(100%,980px);background:#fff;border-radius:24px;box-shadow:0 26px 65px #183d322e;padding:24px;min-height:680px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:17px}.admin-head h1{font:800 30px "Songti SC",serif;color:var(--deep);margin:6px 0}.admin-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.admin-columns section{border:1px solid var(--line);border-radius:17px;padding:18px}.admin-columns h2{font-size:16px;margin:0 0 6px}.admin-columns p{font-size:12px;color:var(--muted);line-height:1.6}.admin-columns input,.admin-columns select{width:100%;border:1px solid #d5e1d6;border-radius:10px;padding:9px 10px;margin:7px 0;font-size:12px}.admin-columns label{font-size:11px;color:#53685e}.admin-queue{grid-column:1/-1}.admin-row{display:grid;grid-template-columns:1.3fr .8fr .7fr .7fr;align-items:center;gap:10px;border-top:1px solid #eef1ec;padding:11px 0;font-size:12px}.admin-row:first-of-type{border:0}.admin-row small{color:var(--muted)}.overlay{position:absolute;inset:0;background:#092b29a8;display:flex;align-items:end;z-index:10}.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;padding:20px 20px 26px;max-height:80%;overflow:auto}.sheet h2{font:800 22px "Songti SC",serif;color:var(--deep)}.sheet p{font-size:12px;line-height:1.7;color:#52645a}.sheet-actions{display:flex;gap:7px}.sheet-actions .button{flex:1}.status-label{color:#ae683d;font-size:11px;font-weight:700}
    @media(max-width:760px){#stage{padding:0;background:var(--paper);gap:0}.review-bar{border-radius:0;box-shadow:none;padding:8px 12px;width:100%;}.review-bar small,.review-notes{display:none}.workbench{display:block;width:100%}.phone{width:100vw;height:calc(100vh - 56px);max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}.phone main{padding-top:13px}.mode-admin{border-radius:0;min-height:calc(100vh - 56px);padding:15px}.admin-columns{grid-template-columns:1fr}.admin-queue{grid-column:auto}.admin-row{grid-template-columns:1fr 1fr}.admin-head{align-items:center}}
  </style>
</head>
<body>
<div id="stage">
  <div class="review-bar"><strong>行业政策 · 产品原型</strong><small>交互演示，所有条目均为虚构样例</small><span class="spacer"></span><button id="userMode" class="active">用户小程序</button><button id="adminMode">资料管理后台</button><select id="scenario" aria-label="演示状态"><option value="normal">正常结果</option><option value="empty">空结果</option><option value="error">来源失败</option></select></div>
  <div class="workbench"><div id="shell" class="phone"></div><aside class="review-notes"><h2>本轮评审重点</h2><span class="label">用户结果优先</span><ol><li>首页能否直接理解“输入需求→得到结论与出处”？</li><li>仅题录和已核验证据是否容易区分？</li><li>关注与导出的入口是否自然？</li><li>后台导入、审核、发布是否足够清楚？</li></ol><p>点右上方切换后台。演示状态可切换正常、空结果及来源失败。原型不连接真实数据，也不生成文件。</p></aside></div>
</div>
<script>
  'use strict';
  const demo=[
    {id:1,title:'某市智能制造示范项目申报通知（演示样例）',kind:'申报通知',region:'示例地区',date:'2026-09-01',publisher:'示例主管部门',source:'示例通知栏目',rights:'证据可用',version:1,answer:'申报截止日为 2026 年 10 月 15 日，适用条件需逐项核对。',evidence:'通知第 3 条',url:'https://example.org/demo-policy-1',summary:'本条目仅用于演示页面与交互。',status:'verified'},
    {id:2,title:'某企业产业观察报告（演示题录）',kind:'研究报告',region:'全国',date:'2026-08-20',publisher:'示例研究机构',source:'示例报告库',rights:'仅题录',version:1,answer:'',evidence:'',url:'https://example.org/demo-report-2',summary:'',status:'metadata'},
    {id:3,title:'某批次企业认定公示名单（演示样例）',kind:'企业名单',region:'示例地区',date:'2026-09-18',publisher:'示例主管部门',source:'示例名单栏目',rights:'证据可用',version:2,answer:'当前仅为公示阶段；是否最终入选须等待正式名单。',evidence:'公示附件第 8 行',url:'https://example.org/demo-list-3',summary:'公示与正式名单需要分开显示。',status:'verified'}
  ];
  const state={mode:'user',page:'answer',query:'',kind:'全部',selected:[],detail:null,scenario:'normal',watch:false,files:[],modal:'',adminStep:0,records:demo.map(x=>({...x}))};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const b=(text,attrs='')=>`<button ${attrs}>${text}</button>`;
  function results(){if(state.scenario==='error')return null;if(state.scenario==='empty')return[];return state.records.filter(x=>(state.kind==='全部'||x.kind===state.kind)&&(!state.query||`${x.title} ${x.answer} ${x.region}`.includes(state.query)))}
  function card(x){return `<article class="card" data-detail="${x.id}"><div class="result-head"><span class="check ${state.selected.includes(x.id)?'on':''}" data-select="${x.id}">${state.selected.includes(x.id)?'✓':''}</span><div class="result-title">${esc(x.title)}</div></div><div class="tags"><span class="tag ${x.status==='verified'?'ok':'copper'}">${x.status==='verified'?'有依据':'仅题录'}</span><span class="tag">${esc(x.kind)}</span><span class="tag">${esc(x.region)}</span><span class="tag">${esc(x.date)}</span></div><div class="answer">${x.answer?`<b>当前结果：</b>${esc(x.answer)}`:'本库仅展示题录和原站入口，未阅读或概括全文。'}</div><div class="source-line"><span>${esc(x.publisher)} · v${x.version}</span><span>查看证据 ›</span></div></article>`}
  function answer(){const rows=results();return `<div data-screen-label="找答案"><div class="hero"><span class="eyebrow">INDUSTRY · EVIDENCE</span><h1 class="serif">找到结果，<br>看清依据。</h1><p>政策、名单、数据和报告，先给与你的任务有关的结果，再看出处。</p><div class="hero-foot"><span>● 已发布资料</span><span>资料范围与缺口可见</span></div></div><div class="section-head"><h2>我要查什么</h2>${b('浏览来源 ›','data-page="sources" class="text-link"')}</div><div class="card"><div class="search"><input id="searchInput" placeholder="例如：某企业是否入选名单" value="${esc(state.query)}">${b('查询','data-search="1" class="button"')}</div><div class="filters">${['全部','政策','申报通知','企业名单','统计数据','研究报告'].map(x=>b(x,`data-kind="${x}" class="chip ${state.kind===x?'active':''}"`)).join('')}</div></div><div class="section-head"><h2>按任务找</h2><span style="font-size:11px;color:#758a7e">少量结果优先</span></div><div class="task-grid">${[['政','政策条件','政策'],['报','申报节点','申报通知'],['单','企业名单','企业名单']].map(x=>b(`<b>${x[0]}</b>${x[1]}`,`data-kind="${x[2]}" class="task"`)).join('')}</div><div class="section-head"><h2>查询结果</h2><span style="font-size:11px;color:#758a7e">${rows?rows.length+' 条':'检查失败'}</span></div><div class="notice">当前仅覆盖已导入、已审核的资料。没有命中不等于政策不存在或企业未入选。</div>${rows===null?`<div class="empty"><b>来源检查失败</b><p>本次无法确认是否有更新；上次结果不能说成“无变化”。</p>${b('重新尝试','data-scenario="normal" class="button"')}</div>`:rows.length?rows.map(card).join(''):`<div class="empty"><b>当前没有结果</b><p>试着减少关键词或切换资料类型。你也可以查看来源覆盖范围。</p>${b('清空条件','data-clear="1" class="button"')}</div>`}${b('关注这个查询','data-watch="1" class="button secondary" style="width:100%;margin-top:6px"')}<p style="font-size:10px;color:#829187;line-height:1.6;margin-top:13px">演示样例 · 非真实政策数据。公开 AI 问答和自动监测属于后续阶段。</p></div>`}
  function detail(){const x=state.records.find(r=>r.id===state.detail);if(!x)return answer();return `<div data-screen-label="资料详情">${b('‹ 返回结果','data-back="1" class="back"')}<div class="eyebrow">SOURCE RECORD #${x.id}</div><h1 class="detail-title">${esc(x.title)}</h1><div class="tags"><span class="tag ${x.status==='verified'?'ok':'copper'}">${x.status==='verified'?'有依据':'仅题录'}</span><span class="tag">${esc(x.kind)}</span><span class="tag">v${x.version}</span></div><div class="card"><h2 style="font-size:18px;color:var(--deep)">${x.answer?'核验结果':'目前只能查看题录'}</h2><p style="font-size:13px;line-height:1.7">${esc(x.answer||'本库未核验正文，请打开原站阅读原文。')}</p>${x.evidence?`<div class="notice">证据位置：${esc(x.evidence)}</div>`:''}</div><div class="section-head"><h2>来源与版本</h2></div><div class="card">${[['发布机构',x.publisher],['来源栏目',x.source],['发布日期',x.date],['使用范围',x.rights],['资料版本','v'+x.version],['原站地址',x.url]].map(r=>`<div class="detail-row"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}</div><div class="notice warn">来源更正、撤回或权限变化时，需要重新核对。这里没有真实外部链接。</div><div class="action-row">${b('加入所选',`data-select="${x.id}" class="button secondary"`)}${b('Excel 预览','data-export="XLSX" class="button"')}${b('Word 预览','data-export="DOCX" class="button"')}</div></div>`}
  function watch(){return `<div data-screen-label="关注"><div class="eyebrow">TRACKING DESK</div><h1 class="top-title">我的关注</h1><p class="top-sub">保存查询范围；正式版由获准来源监测变化。本原型演示状态，不发送提醒。</p><div class="notice warn">首次检查建立历史基线；来源失败时必须显示缺口，不能报告“无变化”。</div><div class="section-head"><h2>已关注事项</h2>${b('添加关注','data-page="answer" class="text-link"')}</div>${state.watch?`<div class="card"><span class="tag ok">已建立基线</span><h3 style="font-size:16px;margin:7px 0">${esc(state.query||'全部已发布资料')}</h3><p style="font-size:12px;color:#697b70">当前范围：${esc(state.kind)} · ${results()?.length??'未知'} 条演示记录</p><div class="action-row">${b('检查更新','data-check="1" class="button"')}${b('查看结果','data-page="answer" class="button secondary"')}</div></div>`:`<div class="empty"><b>还没有关注事项</b><p>在找答案页查询后，保存当前范围。</p>${b('去找答案','data-page="answer" class="button"')}</div>`}</div>`}
  function files(){return `<div data-screen-label="文件"><div class="eyebrow">YOUR DELIVERABLES</div><h1 class="top-title">我的文件</h1><p class="top-sub">正式产品只导出选中的结果，并保留生成时的证据版本。</p><div class="notice">演示原型不会创建真实 Excel 或 Word 文件。</div><div class="section-head"><h2>导出预览记录</h2><span style="font-size:11px;color:#7b8c82">${state.files.length} 项</span></div>${state.files.length?state.files.map((f,i)=>`<div class="card"><span class="tag copper">${esc(f.format)} 结构预览</span><h3 style="font-size:15px;margin:6px 0">${esc(f.name)}</h3><p style="font-size:11px;color:#718478">${f.count} 条所选结果 · 不含未授权原件</p>${b('查看结构','data-file="'+i+'" class="button secondary small"')}</div>`).join(''):`<div class="empty"><b>还没有文件</b><p>先在找答案页勾选记录，再查看导出内容结构。</p>${b('去找答案','data-page="answer" class="button"')}</div>`}</div>`}
  function mine(){return `<div data-screen-label="我的"><div class="hero"><span class="eyebrow">INDUSTRY POLICY</span><h1 class="serif">行业政策</h1><p>资料有出处，结论可核验。</p><div class="hero-foot"><span>原型评审版</span><span>非真实账号</span></div></div><div class="section-head"><h2>使用与设置</h2></div><div class="card">${[['来源目录','查看登记来源与使用范围','sources'],['产品边界','AI、支付、自动监测的阶段说明','about'],['资料管理后台','体验导入、待审和发布状态','admin']].map(r=>`<div class="list-row" data-page="${r[2]}"><span><b>${r[0]}</b><small>${r[1]}</small></span><span>›</span></div>`).join('')}</div><p style="font-size:11px;color:#74857a;line-height:1.7">本原型用于确认产品交互，不连接真实数据、账号或支付。</p></div>`}
  function sources(){return `<div data-screen-label="来源目录">${b('‹ 返回','data-back="1" class="back"')}<div class="eyebrow">SOURCE DIRECTORY</div><h1 class="top-title">来源目录</h1><p class="top-sub">先看发布机构和可用范围，再决定能否进入答案与导出。</p><div class="notice">演示条目为虚构机构。正式接入逐站核对访问方式、摘要、AI 阅读及导出权限。</div>${[['示例通知栏目','示例主管部门','证据可用'],['示例报告库','示例研究机构','仅题录']].map(r=>`<div class="card"><span class="tag ${r[2]==='仅题录'?'copper':'ok'}">${r[2]}</span><h3 style="margin:6px 0;font-size:16px">${r[0]}</h3><p style="font-size:12px;color:#687a70;margin:0">发布机构：${r[1]}</p></div>`).join('')}</div>`}
  function about(){return `<div data-screen-label="产品边界">${b('‹ 返回','data-back="1" class="back"')}<div class="eyebrow">PRODUCT SCOPE</div><h1 class="top-title">分阶段建设</h1><div class="card"><h3>首期：可信结果</h3><p style="font-size:12px;line-height:1.7">后台登记来源与权限、导入审核、前台查询和证据、关注变化、选择结果导出。</p></div><div class="card"><h3>后续：AI 与商业</h3><p style="font-size:12px;line-height:1.7">在来源许可、质量评测和平台能力满足后，再开放 AI 问答、跨行业报告、外部连接、收费。</p></div></div>`}
  function nav(){return `<nav>${[['answer','找答案','答'],['watch','关注','关'],['files','文件','文'],['mine','我的','我']].map(r=>b(`<span>${r[2]}</span>${r[1]}`,`data-page="${r[0]}" class="${state.page===r[0]?'active':''}"`)).join('')}</nav>`}
  function modal(){if(!state.modal)return'';let content='';if(state.modal==='export'){content=`<h2>导出所选结果</h2><p>以下为文件结构预览；原型不会生成真实文件。</p><div class="card"><b>${esc(state.exportFormat)} · ${state.selected.length||1} 条</b><p style="margin:8px 0 0">结论 / 资料阶段 / 发布机构 / 原站与证据位置 / 版本 / 覆盖缺口</p></div><div class="sheet-actions">${b('取消','data-close="1" class="button outline"')}${b('保存预览记录','data-save-export="1" class="button"')}</div>`}else if(state.modal==='check'){content=`<h2>关注检查结果</h2><p>${state.scenario==='error'?'来源失败，不能确认有无变化。':'演示基线已保存。此原型不自动访问官网，也不会发送通知。'}</p>${b('知道了','data-close="1" class="button"')}`}else if(state.modal==='file'){content=`<h2>导出文件结构</h2><p>所选结果与证据版本冻结后，正式产品将生成可编辑文件，并标明生成时间、来源及缺口。本原型没有真实下载。</p>${b('关闭','data-close="1" class="button"')}`}return `<div class="overlay" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${content}</div></div>`}
  function admin(){return `<div class="admin-head"><div><div class="eyebrow">SOURCE · REVIEW · PUBLISH</div><h1>资料管理后台</h1><p style="font-size:12px;color:#6b8074;margin:0">来源许可 → 导入预览 → 待审 → 发布。所有操作仅演示状态。</p></div><span class="tag copper">演示数据</span></div><div class="admin-columns"><section><h2>① 登记来源</h2><p>正式版需逐动作记录题录、短摘、AI 阅读、导出等权限和审核依据。</p><label>发布机构</label><input value="示例主管部门" aria-label="发布机构"><label>来源栏目</label><input value="示例通知栏目" aria-label="来源栏目"><label>可用范围</label><select><option>仅题录</option><option>题录与短摘</option><option selected>获准证据与答案</option></select>${b('保存演示来源','data-admin-step="1" class="button"')}</section><section><h2>② 导入与预览</h2><p>CSV / XLSX 应先检查表头、重复、越权字段与行级错误；导入不等于发布。</p><div class="notice ${state.adminStep>=1?'':'warn'}">${state.adminStep>=1?'来源已登记。可继续导入样例。':'请先登记来源。'}</div><label>导入文件</label><input type="text" value="demo-list.xlsx（演示）" aria-label="演示导入文件" readonly>${b('预览并提交待审','data-admin-step="2" class="button" '+(state.adminStep<1?'disabled':''))}</section><section class="admin-queue"><h2>③ 待审队列与发布</h2><p>审核人核对原站、证据位置和阶段后，公开指针才会切换到新版本。</p><div class="admin-row"><b>某批次企业认定公示名单（样例）</b><small>附件第 8 行 · v2</small><span class="status-label">${state.adminStep>=3?'已发布':state.adminStep>=2?'待审':'尚未导入'}</span>${b('审核发布','data-admin-step="3" class="button small" '+(state.adminStep<2?'disabled':''))}</div><div class="notice">${state.adminStep>=3?'发布完成。用户端只读取已发布版本；后续更正需再次审核。':'未审核内容不会出现在用户端答案或导出中。'}</div></section></div>`}
  function render(){document.getElementById('userMode').classList.toggle('active',state.mode==='user');document.getElementById('adminMode').classList.toggle('active',state.mode==='admin');const shell=document.getElementById('shell');shell.className=state.mode==='admin'?'mode-admin':'phone';shell.innerHTML=state.mode==='admin'?admin():`<div class="phone-top"></div><main>${state.page==='answer'?answer():state.page==='detail'?detail():state.page==='watch'?watch():state.page==='files'?files():state.page==='sources'?sources():state.page==='about'?about():mine()}</main>${nav()}${state.selected.length?`<div class="selection"><span>已选 <b>${state.selected.length}</b> 条</span><div>${b('Excel', 'data-export="XLSX" class="button outline small"')}${b('Word','data-export="DOCX" class="button small"')}</div></div>`:''}${modal()}`}
  document.getElementById('stage').addEventListener('click',e=>{const el=e.target.closest('[data-page],[data-detail],[data-select],[data-kind],[data-search],[data-watch],[data-export],[data-close],[data-save-export],[data-check],[data-admin-step],[data-scenario],[data-clear],[data-back],[data-file]');if(!el)return;const d=el.dataset;if(d.page){if(d.page==='admin'){state.mode='admin'}else{state.mode='user';state.page=d.page}render();return}if(d.detail){state.detail=Number(d.detail);state.page='detail';render();return}if(d.select){const id=Number(d.select);state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];render();return}if(d.kind){state.kind=d.kind;state.page='answer';render();return}if(d.search){state.query=document.getElementById('searchInput')?.value.trim()||'';render();return}if(d.clear){state.query='';state.kind='全部';state.scenario='normal';document.getElementById('scenario').value='normal';render();return}if(d.watch){state.watch=true;state.page='watch';render();return}if(d.export){state.exportFormat=d.export;state.modal='export';render();return}if(d.saveExport){state.files.unshift({format:state.exportFormat,count:state.selected.length||1,name:'所选资料报告（交互预览）'});state.modal='';state.page='files';render();return}if(d.check){state.modal='check';render();return}if(d.file){state.modal='file';render();return}if(d.adminStep){state.adminStep=Math.max(state.adminStep,Number(d.adminStep));render();return}if(d.back){state.page='answer';render();return}if(d.close){if(el.classList.contains('overlay')&&e.target!==el)return;state.modal='';render();return}if(d.scenario){state.scenario=d.scenario;render()}});
  document.getElementById('userMode').addEventListener('click',()=>{state.mode='user';render()});document.getElementById('adminMode').addEventListener('click',()=>{state.mode='admin';render()});document.getElementById('scenario').addEventListener('change',e=>{state.scenario=e.target.value;render()});render();
</script>
</body>
</html>
