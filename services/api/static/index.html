<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行业研究台 · 找答案</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell" data-screen-label="用户资料检索与导出">
    <header class="topbar">
      <div class="brand">行业研究台<small>POLICY · DATA · EVIDENCE</small></div>
      <nav class="toplinks" aria-label="页面导航"><a href="#sources">浏览来源</a><a href="/admin">管理入口</a></nav>
    </header>
    <section class="hero">
      <span class="eyebrow">ANSWER FIRST · 资料有出处</span>
      <h1>问具体问题，<br>看可核对的结果。</h1>
      <p>查询经过审核的行业资料。每条结果说明发布机构、原站和核验状态；仅有题录时明确提示，不替原文件编造答案。</p>
    </section>
    <div class="section-head"><h2>找答案与资料</h2><span id="result-count">等待查询</span></div>
    <form id="search-form" class="panel searchbox">
      <input id="query" name="q" aria-label="搜索问题或关键词" placeholder="例如：青岛专精特新申报截止日" maxlength="100">
      <select id="kind" name="kind" aria-label="资料类型"><option value="">全部类型</option><option value="policy">政策</option><option value="application">申报通知</option><option value="list">企业名单</option><option value="statistics">统计数据</option><option value="report">研究报告</option><option value="other">其他</option></select>
      <input id="industry" name="industry" aria-label="行业" placeholder="行业" maxlength="100">
      <input id="region" name="region" aria-label="地区" placeholder="地区" maxlength="100">
      <button class="button" type="submit">查找结果</button>
    </form>
    <p id="search-status" class="status" role="status"></p>
    <main id="results" class="results" aria-live="polite"></main>
    <section class="selected" id="selected-bar" hidden aria-label="导出所选结果">
      <div><strong id="selected-count">已选 0 条</strong><small>只导出所选的已发布资料与出处</small></div>
      <div class="row"><button id="export-xlsx" class="button" type="button">导出 Excel</button><button id="export-docx" class="button" type="button">导出 Word</button></div>
    </section>
    <div class="section-head" id="sources"><h2>来源目录</h2><span>打开发布机构原站核对</span></div>
    <div id="source-list" class="source-grid"></div>
    <p class="footnote">当前为可运行的本地试用版。资料由管理员人工导入并审核；查询结果只覆盖已发布的资料。原站更正或资料权限变化时，以发布机构的最新信息为准。</p>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
